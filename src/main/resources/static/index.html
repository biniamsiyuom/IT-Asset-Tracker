 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    header {
      background: #142b4a;
      color: white;
      padding: 22px 30px;
    }
    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 7px 0 0; color: #cbd7e7; }
    main { max-width: 1150px; margin: 28px auto; padding: 0 20px; }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    input, button {
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    input {
      border: 1px solid #d5dce7;
      background: white;
      flex: 1;
      min-width: 200px;
    }
    button {
      border: 0;
      background: #2463eb;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #194fc7; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card, .panel {
      background: white;
      padding: 21px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #1720330b;
    }
    .card p { color: #667085; margin: 0 0 10px; }
    .number { font-size: 30px; font-weight: 700; }
    .panel h2 { margin-top: 0; font-size: 19px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 13px 12px;
      border-bottom: 1px solid #edf0f5;
      white-space: nowrap;
    }
    th { color: #667085; font-size: 12px; text-transform: uppercase; }
    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e2f7e9;
      color: #18733a;
      font-size: 12px;
    }
    .assigned { background: #fff0d6; color: #925900; }
    #message { color: #667085; margin: 12px 0; }
    footer { text-align: center; padding: 25px; color: #667085; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>IT Asset Tracker</h1>
    <p>Asset inventory and assignment dashboard</p>
  </header>

  <main>
    <div class="toolbar">
      <input id="username" value="admin" aria-label="Username" placeholder="Username">
      <input id="password" type="password" aria-label="Password"
             placeholder="Password">
      <button onclick="loadAssets()">Load Assets</button>
    </div>

    <div class="cards">
      <section class="card">
        <p>Total Assets</p>
        <div class="number" id="total">—</div>
      </section>
      <section class="card">
        <p>Available</p>
        <div class="number" id="available">—</div>
      </section>
      <section class="card">
        <p>Assigned</p>
        <div class="number" id="assigned">—</div>
      </section>
    </div>

    <section class="panel">
      <h2>Asset Inventory</h2>
      <div class="toolbar">
        <input id="search" placeholder="Search by name, serial number, category..."
               aria-label="Search assets" oninput="renderAssets()">
        <button onclick="loadAssets()">Refresh</button>
      </div>
      <div id="message">Enter your account details and select Load Assets.</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Asset</th><th>Serial Number</th>
              <th>Category</th><th>Status</th><th>Assigned To</th>
            </tr>
          </thead>
          <tbody id="assetRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>IT Asset Tracker · Inventory Dashboard</footer>

  <script>
    let assets = [];
let lastUsername = '';
let lastPassword = '';

    async function loadAssets() {const enteredUsername = document.getElementById('username').value.trim();
const enteredPassword = document.getElementById('password').value;

const username = enteredUsername || lastUsername;
const password = enteredPassword || lastPassword;
      const message = document.getElementById('message');

      if (!username || !password) {
        message.textContent = 'Enter your username and password first.';
        return;
      }

      message.textContent = 'Loading assets...';

      try {
        const response = await fetch('/api/assets', {
          headers: {
            'Authorization': 'Basic ' + btoa(username + ':' + password)
          }
        });

        if (response.status === 401) {
          throw new Error('Login failed. Check your username and password.');
        }
        if (!response.ok) {
          throw new Error('Could not load assets. HTTP ' + response.status);
        }

        assets = await response.json();
        lastUsername = username;
lastPassword = password; 
        document.getElementById('total').textContent = assets.length;
        document.getElementById('available').textContent =
          assets.filter(a => a.status === 'AVAILABLE').length;
        document.getElementById('assigned').textContent =
          assets.filter(a => a.status === 'ASSIGNED').length;

        renderAssets();
        message.textContent = 'Loaded ' + assets.length + ' asset(s).';
      } catch (error) {
        message.textContent = error.message;
      }
    }

    function renderAssets() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = assets.filter(a =>
        [a.name, a.serialNumber, a.categoryName, a.status, a.assignedToUsername]
          .some(value => String(value || '').toLowerCase().includes(query))
      );

      document.getElementById('assetRows').innerHTML = filtered.map(a => `
        <tr>
          <td>${a.id}</td>
          <td>${escapeHTML(a.name)}</td>
          <td>${escapeHTML(a.serialNumber)}</td>
          <td>${escapeHTML(a.categoryName || '')}</td>
          <td><span class="status ${a.status === 'ASSIGNED' ? 'assigned' : ''}">
            ${escapeHTML(a.status)}</span></td>
          <td>${escapeHTML(a.assignedToUsername || '—')}</td>
        </tr>
      `).join('');

      if (assets.length && !filtered.length) {
        document.getElementById('message').textContent = 'No matching assets found.';
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      })[char]);
    }
        window.addEventListener('DOMContentLoaded', loadAssets);
  </script>
</body>
</html>
