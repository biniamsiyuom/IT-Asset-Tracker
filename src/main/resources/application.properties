spring.application.name=assettracker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/assettracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:assetuser}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8081}
